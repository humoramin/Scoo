# JustScoo demo — served at http://<server>/justscoo (included into the default nginx site)
location = /justscoo  { return 302 /justscoo/ru; }
location = /justscoo/ { return 302 /justscoo/ru; }

location ^~ /justscoo/ {
    root /var/www/sites;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    rewrite ^/justscoo/(ru|en|cs)/gdpr/?$ /justscoo/$1/page/zasady-ochrany-osobnich-udaju permanent;
    rewrite ^/justscoo/(ru|en|cs)/the-terms-and-conditions/?$ /justscoo/$1/page/the-terms-and-conditions permanent;
    location ^~ /justscoo/_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    try_files $uri $uri.html $uri/ =404;
}
